rules = [
  # Our own rule, defined in this repo: scalafix/UncheckedOptionGet.scala
  "file:scalafix/UncheckedOptionGet.scala"

  # From Typelevel's typelevel-scalafix library (the typelevel-scalafix-cats module, added in build.sbt):
  # https://github.com/typelevel/typelevel-scalafix#typelevelmapsequence
  TypelevelMapSequence

  # Built into Scalafix itself, no extra dependency:
  # https://scalacenter.github.io/scalafix/docs/rules/DisableSyntax.html
  DisableSyntax
]

# DisableSyntax does nothing until configured: ban constructs that don't belong in pure, typed code
DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noThrows = true
}
