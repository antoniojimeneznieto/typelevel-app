name: Opengrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  opengrep:
    name: Opengrep
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload findings to code scanning
    env:
      OPENGREP_VERSION: v1.30.0
      OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
    steps:
      - uses: actions/checkout@v7

      - name: Install Opengrep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86"
          echo "$OPENGREP_SHA256  $RUNNER_TEMP/opengrep" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/opengrep" /usr/local/bin/opengrep

      - name: Test rules
        run: opengrep test .opengrep

      - name: Scan
        run: opengrep scan --config .opengrep --error --sarif-output=opengrep.sarif src

      - name: Upload findings to code scanning
        if: ${{ !cancelled() && hashFiles('opengrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opengrep.sarif
          category: opengrep
